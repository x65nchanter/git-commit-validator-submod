# ==============================================================================
# GITHUB ACTIONS CONTINUOUS INTEGRATION PIPELINE MANIFEST
# ==============================================================================
# Description: Orchestrates automated test suite matrices across heterogeneous
#              operating system nodes (Ubuntu Linux and Windows Server).
# ==============================================================================
name: Repository Validation Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # PIPELINE STREAM 1: POSIX RUNTIME VALIDATION (CONTAINERIZED SHELLSPEC)
  # ============================================================================
  linux-runtime-verification:
    name: Execute POSIX Shell Verification Matrix
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code Target
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Simulate Installation (Copy Script to Root)
        run: |
          cp deploy/install.sh install.sh
          chmod +x install.sh

      - name: Invoke Project Verification (ShellSpec)
        uses: docker://shellspec/shellspec:latest
        with:
          args: "--chdir /github/workspace"

      - name: Invoke Shell Deployment Verification (ShellSpec)
        uses: docker://shellspec/shellspec:latest
        with:
          args: "--chdir /github/workspace deploy/"

  # ============================================================================
  # PIPELINE STREAM 2: WINDOWS RUNTIME VALIDATION (POWERSHELL / PESTER)
  # ============================================================================
  windows-runtime-verification:
    name: Execute Native Windows PowerShell Matrix
    runs-on: windows-latest

    steps:
      - name: Checkout Source Code Target
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Invoke PowerShell Deployment Verification (Pester)
        shell: pwsh
        run: |
          Install-Module -Name Pester -Force -SkipPublisherCheck -Scope CurrentUser
          Import-Module Pester -Force
          Invoke-Pester -Path ./deploy/install.Tests.ps1 -Output Detailed
